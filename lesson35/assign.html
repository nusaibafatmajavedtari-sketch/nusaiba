<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
  <div id="app">
  <h1 id="app-title">bank app</h1>
<div id="balance-box">
      <p id="balance-label"> balance</p>
      <p id="balance">1000</p>

    <div id="entry-box">

    <div id="button-box">
      <button class="action credit" id="credit-btn">Credit</button>
      <button class=" action debit" id="debit-btn">Debit</button>
    </div>
  <p id="message"></p>
 <p id="note">Terms and conditions Apply</p>
</div>
