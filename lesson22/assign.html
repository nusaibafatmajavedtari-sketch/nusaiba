<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link

href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"

rel="stylesheet">

</head>

<body class="py-4">

<style>
body { background-color: white;}
h1 { color: yellow; }
</style>

<div class="container">
<h1>My Favourite Person Profile</h1>


<div class="card shadow-sm mb-3" style="max-width:400px;">
<div class="card-body">
<h5 class="card-title" style="color:yellow;">Profile</h5>
<ul class="list-group list-group-flush">
<li class="list-group-item">
<span class="card-label d-block">Name</span>
<strong id="name">—</strong>
</li>
<li class="list-group-item">
<span class="card-label d-block">relationship</span>
<strong id="relationship">—</strong>
</li>
<li class="list-group-item">
<span class="card-label d-block">activity</span>
<strong id="activity">—</strong>
</li>
<li class="list-group-item">
<span class="card-label d-block">City</span>
<strong id="city">—</strong>
</li>
</ul>
</div>
</div>
<div class="card shadow-sm" style="max-width:400px;">
<div class="card-body">
<h6 style="color:yellow;">JavaScript Object Used</h6>
<pre id="codeDisplay"
class="bg-light p-3 rounded border mb-0"></pre>
</div>
</div>
</div>

    <script>
 var favouritePerson= {
    name: "someone",
    relationship: "something",
    activity: "some activity",
    city: "some place",
 };

 var nameE1= document.getElementById("name");
 var relationshipE1= document.getElementById("relationship");
 nameE1.textContent= favouritePerson.name;
relationshipE1.textContent= favouritePerson.relationship;

var activityE1= document.getElementById("activity");
var cityE1= document.getElementById("city");
activityE1.textContent= favouritePerson["activity"];
cityE1.textContent= favouritePerson["city"];

var codeE1= document.getElementById("codeDisplay");
codeE1.textContent=
'var favoritePerson= {\n' +
'name: "' + favouritePerson.name + '",\n' +
'phone: "' + favouritePerson.relationship + '",\n' +
'school: "' + favouritePerson["activity"] + '",\n' +
'city: "' + favouritePerson["city"] + '",\n' +
'};';
    </script>
</body>
</html>
