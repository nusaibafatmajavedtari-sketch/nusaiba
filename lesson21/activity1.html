<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Javascript string methods</h2>
    <p>basic methods</p>
    <p id="p"></p>
    <script>
       var str="AmAzInG"
       // document.getElementById("p").innerHTML= str.toUpperCase() 
        const p=document.getElementById("p") 
        p.innerHTML= str.toUpperCase()
        p.innerHTML+= str.toLowerCase()
        p.innerHTML+= "<br>" + str.startsWith('i') 
        var str1 = "I learnt about Methods"
      var pattern= new RegExp("about")
      p.innerHTML+= "<br>" + pattern.test(str1) 
    </script>
</body>
</html>
