<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Methods and Loops</title>
</head>
<body>
    <h1 id="h">Methods and Loops </h1>
    <p id="1">Numbers from 1 to 10</p>
    <script>
     var number= " "
     for ( i=1; i<11; i++){
        number += i + "<br>"
     }

     // number+= "<br>" means number = number+ "<br>"
    
     document.write("The random value " + Math.floor(Math.random()*100));
     var date = new Date();
     document.write("Today's Date is " + date.getDate());
    </script>
</body>
</html>
