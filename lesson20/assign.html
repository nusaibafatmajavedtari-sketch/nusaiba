<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>multiplication using functions </title>
</head>
<body>
    <h1 id="h"></h1>
    <button onclick="MultiplyNumbers(2,11)">Click</button>
    <p id="2"></p>
    <script>
  var x=2;
  var y;
   document.getElementById("h").innerHTML= "Multipliication"
   function MultiplyNumbers (x,y) { 
     if (y===undefined){
    y=11;
   }
   document.getElementById("2").innerHTML= x*y; 
}

    </script>
</body>
</html>
